name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker compose build test
      - name: Build the plugin
        run: docker compose run --rm build
      - name: Run the tests
        run: docker compose run --rm test
